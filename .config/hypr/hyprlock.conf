general {
    no_fade_in = false
    grace = 0
    disable_loading = true
    numlock_by_default = true 
}

background {
    monitor =
    path = screenshot
    blur_passes = 2 
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.30
    vibrancy = 0.2
}

# 1. HORA (Formato 12 horas con AM/PM)
label {
    monitor =
    # Usamos el comando date para dar formato de 12 horas (%I:%M %p)
    text = cmd[update:1000] echo "$(date +'%I:%M:%S %p')"
    color = rgb(242, 242, 242)
    font_size = 120
    font_family = Ndot57
    position = 0, 150
    halign = center
    valign = center
}

# 2. FECHA COMPLETA (Nueva info)
label {
    monitor =
    # Muestra el día de la semana, día del mes y el año
    text = cmd[update:43200000] echo "$(date +'%A, %d de %B')"
    color = rgb(140, 140, 140)
    font_size = 25
    font_family = Ndot57
    position = 0, 70
    halign = center
    valign = center
}

# Saludo Inteligente
label {
    monitor =
    # Un script de una sola línea que revisa la hora actual para decidir el saludo
    text = cmd[update:60000] H=$(date +%H); if [ $H -lt 12 ]; then echo "Buenos Dias, srluis2080 "; elif [ $H -lt 18 ]; then echo "Buenas Tardes, srluis2080 "; else echo "Buenas Noches, srluis2080 "; fi
    color = rgba(255, 0, 0, 1)
    font_size = 25
    font_family = Ndot57
    position = 0, 80
    halign = center
    valign = bottom
}


# INPUT FIELD (Caja de contraseña)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    outer_color = rgb(74, 74, 74) rgb(140, 140, 140) 45deg
    inner_color = rgba(26, 27, 38, 0.75)
    font_color = rgba(242, 242, 242, 1)
    active_color = rgba(255, 255, 255, 1.0)
    backspace_color = rgb(128, 155, 218)

    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i> # Texto de error personalizado
    fail_color = rgb(215, 25, 33) k# El borde cambia de color si fallas
    
    check_color = rgba(242, 242, 242, 1) # El borde gira en color cian mientras procesa
    ,
    fade_on_empty = false
    placeholder_text = <span foreground="##f2f2f2"><i>Introduce la contraseña...</i></span>
    hide_input = false
    capslock_color = rgb(145, 0, 0) # Se resalta el borde si el capslock esta activo
    
    position = 0, -40
    halign = center
    valign = center
}

# Contenedor Píldora Disco
input-field {
    monitor =
    size = 180, 35
    fail_color = rgb(242, 242, 242)
    check_color = rgba(242, 242, 242, 1)
    outline_thickness = 3
    inner_color = rgba(26, 27, 38, 0.85)
    fade_on_empty = false
    placeholder_text =     # Vacío para que sirva de fondo
    hide_input = true
    position = 30, 85
    outer_color = rgb(74, 74, 74) rgb(140, 140, 140) 45deg
    halign = left
    valign = bottom
}

# Texto del Disco
label {
    monitor =
    # Ejecuta df y extrae el espacio usado y total de la raíz (/)
    text = cmd[update:60000] echo "󰋊   $(df -h / | awk 'NR==2 {print $3 "/" $2}')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = Ndot57
    position = 45, 93
    halign = left
    valign = bottom
}

# Contenedor Píldora RAM
input-field {
    monitor =
