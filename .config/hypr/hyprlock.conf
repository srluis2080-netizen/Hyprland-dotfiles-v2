# ==========================================================
# hyprlock - Material You + paleta Nothing
#   Paleta: negro #000000 | superficie #0E0E0E | tile #1A1A1A | linea #2A2A2A
#           gris oscuro #4A4A4A | gris #8C8C8C | blanco #F2F2F2 | rojo #D71921
#   Requiere hyprlock con el widget "shape" (v0.4.0 o superior)
# ==========================================================

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
    hide_cursor = true
    ignore_empty_input = true
}

# Fondo: captura de pantalla desenfocada y oscurecida
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.30
    vibrancy = 0.2
}

# ---------- CENTRO ----------

# Hora (12 horas con AM/PM)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M:%S %p')"
    color = rgb(242, 242, 242)
    font_size = 120
    font_family = Ndot57
    position = 0, 150
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d de %B')"
    color = rgb(140, 140, 140)
    font_size = 25
    font_family = Ndot57
    position = 0, 70
    halign = center
    valign = center
    zindex = 2
}

# Campo de contrasena (pastilla tonal)
input-field {
    monitor =
    size = 340, 64
    rounding = -1
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(42, 42, 42)
    inner_color = rgba(26, 26, 26, 0.92)
    font_color = rgb(242, 242, 242)
    font_family = Ndot57
    check_color = rgb(242, 242, 242)
    fail_color = rgb(215, 25, 33)
    capslock_color = rgb(145, 0, 0)

    fail_text = <span foreground="##d71921">Contraseña incorrecta ($ATTEMPTS)</span>
    fail_timeout = 2000
    fade_on_empty = false
    placeholder_text = <span foreground="##8c8c8c">Introduce la contraseña...</span>
    hide_input = false

    position = 0, -40
    halign = center
    valign = center
    zindex = 3
}

# Saludo (pastilla tonal con texto rojo)
shape {
    monitor =
    size = 480, 56
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = 0, 75
    halign = center
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] H=$(date +%H); if [ $H -lt 12 ]; then echo "Buenos Dias, srluis2080 "; elif [ $H -lt 18 ]; then echo "Buenas Tardes, srluis2080 "; else echo "Buenas Noches, srluis2080 "; fi
    color = rgb(215, 25, 33)
    font_size = 25
    font_family = Ndot57
    position = 0, 83
    halign = center
    valign = bottom
    zindex = 2
}

# ---------- PILDORAS DE INFORMACION ----------

# Abajo a la izquierda: actualizaciones, disco y RAM
shape {
    monitor =
    size = 190, 35
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = 30, 130
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:3600000] echo "󰏔   $(checkupdates | wc -l) Packages"
    color = rgb(242, 242, 242)
    font_size = 12
    font_family = Ndot57
    position = 46, 138
    halign = left
    valign = bottom
    zindex = 2
}

shape {
    monitor =
    size = 190, 35
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = 30, 85
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] echo "󰋊   $(df -h / | awk 'NR==2 {print $3 "/" $2}')"
    color = rgb(242, 242, 242)
    font_size = 12
    font_family = Ndot57
    position = 46, 93
    halign = left
    valign = bottom
    zindex = 2
}

shape {
    monitor =
    size = 190, 35
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = 30, 40
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:5000] echo "   $(free -h | awk 'NR==2 {print $3 "/" $2}' | sed 's/Gi/G/g')"
    color = rgb(242, 242, 242)
    font_size = 12
    font_family = Ndot57
    position = 46, 48
    halign = left
    valign = bottom
    zindex = 2
}

# Arriba a la izquierda: uptime
shape {
    monitor =
    size = 190, 35
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = 30, -30
    halign = left
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] echo "󱎫   $(uptime -p | sed -E 's/up //; s/ weeks?/ sem/; s/ days?/ d/; s/ hours?/ h/; s/ minutes?/ min/; s/,//g') "
    color = rgb(242, 242, 242)
    font_size = 12
    font_family = Ndot57
    position = 46, -39
    halign = left
    valign = top
    zindex = 2
}

# Arriba a la derecha: procesos
shape {
    monitor =
    size = 150, 35
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = -30, -30
    halign = right
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:5000] echo " $(ps ax | wc -l) Tareas"
    color = rgb(242, 242, 242)
    font_size = 12
    font_family = Ndot57
    position = -46, -39
    halign = right
    valign = top
    zindex = 2
}

# Abajo a la derecha: dispositivo Bluetooth y bateria
shape {
    monitor =
    size = 167, 36
    color = rgba(26, 26, 26, 0.88)
    rounding = -1
    border_size = 1
    border_color = rgba(42, 42, 42, 1.0)
    position = -30, 40
    halign = right
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] MAC=$(bluetoothctl devices Connected | awk '{print $2}' | head -n 1); if [ -n "$MAC" ]; then NAME=$(bluetoothctl info $MAC | grep "Name:" | cut -d' ' -f2-); PCT=$(upower -i $(upower -e | grep 'headset' | head -n 1) | grep percentage | awk '{print $2}'); echo " $NAME ($PCT)"; else echo " Sin dispositivo"; fi
    color = rgb(242, 242, 242)
    font_size = 13
    font_family = Ndot57
    position = -46, 48
    halign = right
    valign = bottom
    zindex = 2
}