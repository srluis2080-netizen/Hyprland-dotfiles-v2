# Texto del Uptime
label {
    monitor =
    # Usa el comando uptime -p simplificado (ej: "up 2 hours, 5 minutes")
    text = cmd[update:60000] echo "󱎫 $(uptime -p | sed 's/up //') "
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = Ndot57
    position = 42, -39
    halign = left
    valign = top
}

# Contenedor Píldora Actualizaciones
input-field {
    monitor =
    size = 170, 35
    fail_color = rgb(242, 242, 242)
    check_color = rgba(242, 242, 242, 1)
    outline_thickness = 3
    outer_color = rgb(74, 74, 74) rgb(140, 140, 140) 45deg
    inner_color = rgba(26, 27, 38, 0.85)
    fade_on_empty = false
