# Texto de Procesos
label {
    monitor =
    # Cuenta los procesos activos en el sistema
    text = cmd[update:5000] echo " $(ps ax | wc -l) Tareas"
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = Ndot57
    position = -192, -39
    halign = right
    valign = top
}

# 3. NOMBRE Y BATERÍA DEL HEADSET BLUETOOTH (Letras Blancas)
label {
    monitor =
    # Busca el dispositivo conectado, extrae su nombre comercial y su porcentaje de batería
    text = cmd[update:10000] MAC=$(bluetoothctl devices Connected | awk '{print $2}' | head -n 1); if [ -n "$MAC" ]; then NAME=$(bluetoothctl info $MAC | grep "Name:" | cut -d' ' -f2-); PCT=$(upower -i $(upower -e | grep 'headset' | head -n 1) | grep percentage | awk '{print $2}'); echo " $NAME ($PCT)"; else echo " Sin dispositivo"; fi
    color = rgba(255, 255, 255, 0.9) # Blanco puro con una pizca de transparencia estética
    font_size = 15
    font_family = Ndot57
    position = -10, 10
    halign = right
    valign = bottom
}