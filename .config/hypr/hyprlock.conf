    position = 30, 40
    halign = left
    valign = bottom
}

# Texto de la RAM
label {
    monitor =
    # Ejecuta free -h y acomoda el consumo actual vs el total
    text = cmd[update:5000] echo "   $(free -h | awk 'NR==2 {print $3 "/" $2}' | sed 's/Gi/G/g')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = Ndot57
    position = 45, 48
    halign = left
    valign = bottom
}

