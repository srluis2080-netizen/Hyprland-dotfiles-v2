[manager]
ratio          = [1, 3, 4]      # Proporción de las 3 columnas (padre, actual, previsualización)
sort_by        = "name"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true           # Muestra archivos ocultos por defecto (.config, etc.)
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 1920
max_height      = 1080
image_delay     = 30            # Retraso en milisegundos antes de cargar la imagen

[opener]
edit = [
	{ run = 'subl "$@"', block = false, for = "unix" }
]


